name: Validate specs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tooling
        run: >
          dnf -y install
          rpmlint rpmdevtools python3-devel pyproject-rpm-macros desktop-file-utils

      - uses: actions/checkout@v7

      - name: Validate
        run: ./scripts/validate.sh
